# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/budget_tracker
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=mySecretKey
jwt.expiration=86400

# Banking Integration
plaid.client.id=${PLAID_CLIENT_ID:your_plaid_client_id}
plaid.secret=${PLAID_SECRET:your_plaid_secret}
plaid.environment=${PLAID_ENVIRONMENT:sandbox}

# PayPal Configuration
paypal.client.id=${PAYPAL_CLIENT_ID:your_paypal_client_id}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:your_paypal_client_secret}
paypal.environment=${PAYPAL_ENVIRONMENT:sandbox}

# Security
spring.security.cors.allowed-origins=http://localhost:3000
spring.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.security.cors.allowed-headers=*

# Logging
logging.level.com.examly.springapp=DEBUG
logging.level.org.springframework.web=DEBUG